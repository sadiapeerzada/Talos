[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
version = "0.1.0"
description = "Talos -- automated red team for AI agents. Discovers a tool-using agent's tool graph, generates adversarial attack chains, executes them, and produces a scored vulnerability report."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "networkx>=3.2",
    "pydantic>=2.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
talos-scan = "talos.cli:main"

[tool.setuptools.packages.find]
include = ["talos*"]
