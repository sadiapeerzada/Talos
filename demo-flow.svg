<svg viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="360" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">Live Demo Story Arc</text>
  <text x="550" y="54" text-anchor="middle" font-size="12" fill="#666666">What the judges watch happen, in order</text>

  <!-- circular arrangement of 5 nodes -->
  <!-- node positions on an arc -->
  <g>
    <!-- node 1 -->
    <circle cx="130" cy="200" r="55" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="130" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">Target URL</text>
    <text x="130" y="210" text-anchor="middle" font-size="10" fill="#666666">enter endpoint</text>
    <text x="130" y="224" text-anchor="middle" font-size="10" fill="#666666">+ adapter</text>

    <!-- node 2 -->
    <circle cx="320" cy="120" r="55" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="320" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">Tool Graph</text>
    <text x="320" y="130" text-anchor="middle" font-size="10" fill="#666666">discovered live</text>
    <text x="320" y="144" text-anchor="middle" font-size="10" fill="#666666">in seconds</text>

    <!-- node 3 -->
    <circle cx="540" cy="90" r="55" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="540" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">Attack</text>
    <text x="540" y="100" text-anchor="middle" font-size="10" fill="#666666">Execution</text>
    <text x="540" y="114" text-anchor="middle" font-size="10" fill="#666666">35 templates fire</text>

    <!-- node 4 -->
    <circle cx="760" cy="120" r="55" fill="#111111" stroke="#111111" stroke-width="2.5"/>
    <text x="760" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Critical</text>
    <text x="760" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Finding</text>
    <text x="760" y="145" text-anchor="middle" font-size="10" fill="#dddddd">evidence + repro</text>

    <!-- node 5 -->
    <circle cx="950" cy="200" r="55" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="950" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">Monitor</text>
    <text x="950" y="210" text-anchor="middle" font-size="10" fill="#666666">+ Learn</text>
    <text x="950" y="224" text-anchor="middle" font-size="10" fill="#666666">recurring scans</text>

    <!-- arrows -->
    <path d="M175,175 L280,140" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <path d="M368,100 L497,92" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <path d="M588,100 L714,113" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <path d="M805,145 L910,177" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  </g>

  <!-- loop back arrow -->
  <path d="M950,255 C950,330 130,330 130,255" stroke="#9a9a9a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow2)"/>
  <text x="540" y="325" text-anchor="middle" font-size="11" fill="#999999" font-style="italic">learning re-prioritizes the next scan against the same or a new target</text>

  <!-- step labels -->
  <text x="130" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#111111">1</text>
  <text x="320" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#111111">2</text>
  <text x="540" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#111111">3</text>
  <text x="760" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#111111">4</text>
  <text x="950" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#111111">5</text>
</svg>
