name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Talos (editable) + dev deps
        working-directory: talos
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        working-directory: talos
        run: python -m pytest tests/ -v

  risk-gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Talos (editable)
        working-directory: talos
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run risk-score regression gate
        working-directory: talos
        # Starts the native sample agent locally, runs a real Talos scan
        # against it, and fails this check if the resulting risk_score is
        # HIGHER than the committed baseline in .ci/baseline_risk_score.json
        # -- i.e. this PR made the scanned target more vulnerable. See
        # talos/scripts/ci_risk_gate.py for the comparison logic, which is
        # unit-tested on its own in tests/test_ci_risk_gate.py.
        run: python -m talos.scripts.ci_risk_gate
