<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Talos Scan Pipeline</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#666666">discover → attack → prove → monitor → learn</text>

  <!-- Stage boxes -->
  <!-- 1 Target Agent -->
  <g>
    <rect x="30" y="110" width="150" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="105" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Target Agent</text>
    <text x="105" y="168" text-anchor="middle" font-size="11" fill="#666666">LangChain / native</text>
    <text x="105" y="184" text-anchor="middle" font-size="11" fill="#666666">function-calling</text>
  </g>

  <!-- 2 Adapter normalization -->
  <g>
    <rect x="215" y="110" width="150" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="290" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Adapter</text>
    <text x="290" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Normalization</text>
    <text x="290" y="180" text-anchor="middle" font-size="11" fill="#666666">wire-format agnostic</text>
  </g>

  <!-- 3 Tool graph discovery -->
  <g>
    <rect x="400" y="110" width="170" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="485" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Tool-Graph</text>
    <text x="485" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Discovery</text>
    <text x="485" y="180" text-anchor="middle" font-size="11" fill="#666666">tools · params · side effects</text>
  </g>

  <!-- 4 Attack generation -->
  <g>
    <rect x="605" y="110" width="180" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="695" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Attack</text>
    <text x="695" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Generation</text>
    <text x="695" y="178" text-anchor="middle" font-size="11" fill="#666666">35 templates · adaptive mode</text>
  </g>

  <!-- 5 Execution -->
  <g>
    <rect x="820" y="110" width="170" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="905" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Live</text>
    <text x="905" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Execution</text>
    <text x="905" y="180" text-anchor="middle" font-size="11" fill="#666666">real agent, real traces</text>
  </g>

  <!-- 6 Scoring -->
  <g>
    <rect x="1025" y="110" width="150" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="1100" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Scoring &amp;</text>
    <text x="1100" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Dedup</text>
    <text x="1100" y="180" text-anchor="middle" font-size="11" fill="#666666">severity · reproducibility</text>
  </g>

  <!-- Arrows row 1 -->
  <line x1="180" y1="155" x2="213" y2="155" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="155" x2="398" y2="155" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="155" x2="603" y2="155" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785" y1="155" x2="818" y2="155" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="155" x2="1023" y2="155" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- down arrow to report -->
  <line x1="1100" y1="200" x2="1100" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Report / dashboard row -->
  <g>
    <rect x="850" y="270" width="300" height="90" rx="10" fill="#111111" stroke="#111111" stroke-width="2"/>
    <text x="1000" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Report + Dashboard</text>
    <text x="1000" y="320" text-anchor="middle" font-size="11" fill="#dddddd">Markdown report · streaming JSON</text>
    <text x="1000" y="337" text-anchor="middle" font-size="11" fill="#dddddd">FastAPI live scan UI</text>
  </g>

  <!-- Monitoring box -->
  <g>
    <rect x="430" y="270" width="330" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="595" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Continuous Monitoring</text>
    <text x="595" y="320" text-anchor="middle" font-size="11" fill="#666666">recurring scans on a timer</text>
    <text x="595" y="337" text-anchor="middle" font-size="11" fill="#666666">SQLite run history + alerts</text>
  </g>

  <!-- Learning box -->
  <g>
    <rect x="60" y="270" width="290" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="205" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Cross-Engagement Learning</text>
    <text x="205" y="320" text-anchor="middle" font-size="11" fill="#666666">records template / class performance</text>
    <text x="205" y="337" text-anchor="middle" font-size="11" fill="#666666">re-ranks future attack batches</text>
  </g>

  <!-- Feedback arrows -->
  <path d="M850,315 L760,315" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M430,315 L350,315" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- loop from monitoring back up to attack generation -->
  <path d="M595,270 C595,230 695,230 695,202" stroke="#9a9a9a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <!-- loop from learning back up to attack generation -->
  <path d="M205,270 C205,220 400,150 603,155" stroke="#9a9a9a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>

  <text x="600" y="420" text-anchor="middle" font-size="11" fill="#999999" font-style="italic">
    Grey dashed lines: monitoring re-triggers the scan; learning re-prioritizes the next attack batch.
  </text>

  <!-- Legend -->
  <g transform="translate(30,460)">
    <rect x="0" y="0" width="16" height="16" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="24" y="13" font-size="12" fill="#333333">Implemented pipeline stage</text>
    <rect x="230" y="0" width="16" height="16" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="254" y="13" font-size="12" fill="#333333">Persistent / recurring subsystem (SQLite-backed)</text>
    <rect x="620" y="0" width="16" height="16" fill="#111111"/>
    <text x="644" y="13" font-size="12" fill="#333333">Operator-facing output</text>
  </g>

  <line x1="30" y1="500" x2="1170" y2="500" stroke="#e5e5e5" stroke-width="1"/>
  <text x="600" y="530" text-anchor="middle" font-size="12" fill="#666666">Repository layout mirrors this pipeline 1:1 — harness/ · graph/ · attacks/ · execution/ · reporting/ · scan_service.py · dashboard.py</text>
  <text x="600" y="555" text-anchor="middle" font-size="11" fill="#999999">Talos — the automated red team for AI agents</text>
</svg>
